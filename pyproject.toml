[tool.pytest.ini_options]
testpaths = ["libs/tests", "services/service-template/tests", "services/venue-service/tests"]
pythonpath = ["libs/src", "services/service-template", "services/venue-service"]
markers = [
    "integration: requires a disposable PostgreSQL or LocalStack environment",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
