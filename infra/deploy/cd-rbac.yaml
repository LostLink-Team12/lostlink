# Only existing C3 application deployments and these two ConfigMaps are mutable.
# No Secrets, RBAC, ServiceAccount, Job, pod exec, or cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lostlink-cd, namespace: lostlink}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      - venue-api
      - venue-outbox
      - venue-identity
      - item-api
      - item-tasks
      - item-outbox
      - item-consume
      - item-cleanup
      - matching-api
      - matching-tasks
      - matching-consume
      - matching-outbox
      - claim-api
      - claim-tasks
      - claim-outbox
      - notification-api
      - notification-consume
      - notification-tasks
      - frontend
      - embedding-metrics
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [lostlink-runtime, lostlink-cd-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lostlink-cd, namespace: lostlink}
subjects:
  - {kind: Group, name: lostlink-cd, apiGroup: rbac.authorization.k8s.io}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: lostlink-cd}
