server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /health { return 200 'ok'; }
    location = /config.json {
        alias /public-config/config.json;
        default_type application/json;
        add_header Cache-Control 'no-store';
    }
    location = / { return 302 /owner-app/; }
    location /matches/ { try_files $uri /matches/index.html; }
    location /owner-app/ { try_files $uri $uri/ /owner-app/index.html; }
    location /venue-portal/ { try_files $uri $uri/ /venue-portal/index.html; }
    location /assets/ { try_files $uri =404; }
    # Only public v1 paths are routable. Internal API, metrics, docs and probes
    # have no public route, including encoded/doubled/traversal spellings.
    location ~ ^/api/(venue|item|matching|claim|notification)/v1(/|$) {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s;
        set $backend $1-api.lostlink.svc.cluster.local;
        rewrite ^/api/[^/]+(/v1.*)$ $1 break;
        proxy_pass https://$backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /trust/combined.pem;
        proxy_set_header Host $backend;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { return 404; }
}
