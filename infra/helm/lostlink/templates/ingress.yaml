{{- if .Values.ingress.enabled }}
{{- $root := . }}
# Only the public /v1 prefixes below are routed; /internal/v1/*, /metrics and the probe
# endpoints stay cluster-internal (docs/team-alignment.md section 2).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lostlink-public
  labels:
    app.kubernetes.io/part-of: lostlink
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          {{- range $name := keys .Values.services | sortAlpha }}
          {{- $svc := get $root.Values.services $name }}
          {{- if and $svc.enabled $svc.api }}
          {{- range $path := $svc.publicPaths }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-service" $name }}
                port: {name: https}
          {{- end }}
          {{- end }}
          {{- end }}
{{- end }}
