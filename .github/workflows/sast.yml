name: SAST

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: SAST (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/config.yml
      - name: Analyze candidate source
        id: analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false
      - name: Enforce SAST findings policy
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          python scripts/sast_gate.py "$RUNNER_TEMP/codeql-sarif" \
            --language '${{ matrix.language }}' --analysis-outcome "$ANALYSIS_OUTCOME" \
            --output-dir "$RUNNER_TEMP/sast-public"
      - name: Publish Code scanning results
        if: always() && steps.analyze.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: sast-${{ matrix.language }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-${{ matrix.language }}
          path: ${{ runner.temp }}/sast-public/
          retention-days: 30
          if-no-files-found: error
