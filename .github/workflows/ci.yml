name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
      publish_services: ${{ steps.list.outputs.publish_services }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: list
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          services = sorted(path.parent.name for path in Path("services").glob("*/Dockerfile"))
          if not services:
              raise SystemExit("No services with a Dockerfile found")
          for service in services:
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", service):
                  raise SystemExit(f"Invalid service directory name: {service}")
              for required in ("requirements.txt", "requirements-dev.txt"):
                  if not (Path("services") / service / required).is_file():
                      raise SystemExit(f"Missing {required} for {service}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"services={json.dumps(services)}\n")
              output.write(f"publish_services={json.dumps([*services, 'frontend'])}\n")
          PY

  test:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m "not integration"

  shared-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock ./libs
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/export_contracts.py --check
      - run: python -m pytest -q libs/tests -m "not integration"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lostlink
          POSTGRES_PASSWORD: lostlink
          POSTGRES_DB: lostlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostlink -d lostlink"
          --health-interval 5s --health-timeout 3s --health-retries 20
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3,sns,sqs
          SQS_ENDPOINT_STRATEGY: path
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LOSTLINK_TEST_ADMIN_URL: postgresql+psycopg://lostlink:lostlink@localhost:5432/lostlink
      LOSTLINK_TEST_AWS_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock ./libs
      - run: python -m pytest -q -m integration

  helm-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
      - name: Lint and render
        run: |
          helm lint infra/helm/lostlink -n lostlink -f infra/helm/tests/values-ci.yaml
          helm template lostlink infra/helm/lostlink -n lostlink \
            -f infra/helm/tests/values-ci.yaml > rendered.yaml
          helm template lostlink infra/helm/lostlink -n lostlink \
            -f infra/helm/tests/values-ci.yaml --set migrations.enabled=true > rendered-migrations.yaml
      - name: Validate Kubernetes and KEDA schemas
        run: |
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml rendered-migrations.yaml
      - name: Check IAM contract and startup settings
        run: |
          python -m pip install pyyaml==6.0.2
          python infra/helm/tests/check_rendered.py rendered.yaml
          python -m unittest discover -s infra/helm/tests -p 'test_*.py' -v
      - name: Render the KEDA operator trust configuration
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm template keda kedacore/keda --version 2.21.0 -n keda \
            -f infra/helm/keda-values.yaml > rendered-keda.yaml
          python infra/helm/tests/check_keda.py rendered-keda.yaml
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: infra/helm/tests/pgx_tls/go.sum
      - name: Verify PostgreSQL driver rejects wrong CA and hostname
        working-directory: infra/helm/tests/pgx_tls
        run: go test -mod=readonly -count=1 -v ./...

  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (dependencies, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build-image:
    needs: [discover, test, shared-library, integration, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.service == 'matching-service' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      SERVICE_NAME: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Images build from the repository root because services copy requirements.lock and libs/.
      - name: Build service image
        run: |
          build_args=(--build-arg "SERVICE_DIR=services/${SERVICE_NAME}")
          if [[ "${SERVICE_NAME}" == "matching-service" ]]; then
            build_args+=(--build-arg INSTALL_ML=true)
          fi
          docker build --pull "${build_args[@]}" \
            --file "services/${SERVICE_NAME}/Dockerfile" \
            --tag "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" .
      - uses: actions/setup-python@v6
        if: matrix.service == 'matching-service'
        with:
          python-version: "3.12"
      - name: Verify Matching image with the pinned CLIP model
        if: matrix.service == 'matching-service'
        run: |
          model_dir="${RUNNER_TEMP}/clip"
          python3 scripts/prepare_clip_model.py --destination "${model_dir}/ViT-B-32.pt"
          # The image runs as appuser; the downloader creates a private temporary file.
          chmod 0755 "${model_dir}"
          chmod 0444 "${model_dir}/ViT-B-32.pt"
          python -m pip install pyyaml==6.0.2
          python infra/helm/tests/check_matching_memory.py \
            --image "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" --model-dir "${model_dir}"
      - name: Trivy image scan (OS and application dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: lostlink/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      # Transfer the scanned image; publishing must not rebuild it.
      - name: Save scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Compress once before transfer to keep the larger ML image archive manageable.
        run: >-
          docker save "lostlink/${SERVICE_NAME}:${GITHUB_SHA}"
          | gzip -1 > "${RUNNER_TEMP}/image.tar.gz"
      - name: Upload scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  build-frontend:
    needs: [security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Build frontend gateway
        run: docker build --pull -f infra/deploy/frontend.Dockerfile -t "lostlink/frontend:${GITHUB_SHA}" .
      - name: Verify non-root read-only frontend runtime
        run: |
          name="lostlink-frontend-ci-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --user 1000:1000 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 \
            -v /etc/ssl/certs/ca-certificates.crt:/trust/combined.pem:ro \
            -p 127.0.0.1:18080:8080 "lostlink/frontend:${GITHUB_SHA}"
          curl --fail --retry 6 --retry-connrefused --retry-delay 2 http://127.0.0.1:18080/health
          for path in owner-app/ venue-portal/ matches/test; do
            curl --fail "http://127.0.0.1:18080/$path" | grep -q '/assets/'
          done
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.0
          scan-type: image
          image-ref: lostlink/frontend:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Save scanned frontend image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "lostlink/frontend:${GITHUB_SHA}" | gzip -1 > "${RUNNER_TEMP}/image.tar.gz"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image-frontend
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish-image:
    # Runs once the AWS account is configured (docs/ci.md); until then main stays green.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.AWS_ROLE_ARN != ''
    needs: [discover, build-image, build-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.publish_services) }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SERVICE_NAME: ${{ matrix.service }}
    steps:
      - name: Validate AWS configuration
        run: |
          for variable in AWS_ACCOUNT_ID AWS_REGION AWS_ROLE_ARN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Set the ${variable} repository Actions variable. See docs/ci.md."
              exit 1
            fi
          done
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi
          if [[ "${AWS_ROLE_ARN}" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error::AWS_ROLE_ARN must identify a role in AWS_ACCOUNT_ID (standard AWS partition)."
            exit 1
          fi
      - name: Download scanned image from this run
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/scanned-image
      - name: Load scanned image
        run: |
          docker load --input "${RUNNER_TEMP}/scanned-image/image.tar.gz"
          docker image inspect "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" > /dev/null
      - name: Assume AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: lostlink-ci-${{ github.run_id }}
      - name: Check ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "lostlink/${SERVICE_NAME}" > /dev/null
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          mask-password: "true"
      - name: Push scanned image with commit SHA tag
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="${ECR_REGISTRY}/lostlink/${SERVICE_NAME}:${GITHUB_SHA}"
          docker tag "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" "${image}"
          docker push "${image}"
          # shellcheck disable=SC2016 # Markdown backticks in the format string are literal.
          printf '### Published %s\n\n`%s`\n' "${SERVICE_NAME}" "${image}" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy dev EKS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [publish-image, helm-chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: lostlink-dev-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Skip a superseded main build
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const {data} = await github.rest.repos.getCommit({...context.repo, ref: 'main'});
            const current = data.sha === context.sha;
            core.setOutput('deploy', String(current));
            if (!current) core.notice('A newer main commit exists; its successful CI will deploy instead.');
      - name: Set deployment paths
        if: steps.current.outputs.deploy == 'true'
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/lostlink-kubeconfig" >> "$GITHUB_ENV"
          echo "ACCESS_LEASE=$RUNNER_TEMP/lostlink-access.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        if: steps.current.outputs.deploy == 'true'
        with:
          python-version: '3.12'
      - name: Install deployment dependencies and verified tools
        if: steps.current.outputs.deploy == 'true'
        run: |
          python -m pip install -r requirements-dev.lock ./libs PyYAML==6.0.3
          mkdir -p "$RUNNER_TEMP/cd-tools"
          cd "$RUNNER_TEMP/cd-tools"
          curl --fail --location --retry 3 -o helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl --fail --location --retry 3 -o helm.sha256 https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
          expected="$(cut -d ' ' -f 1 helm.sha256)"
          echo "$expected  helm.tar.gz" | sha256sum --check
          tar -xzf helm.tar.gz
          curl --fail --location --retry 3 -o kubectl https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 -o kubectl.sha256 https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/cd-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cd-tools/linux-amd64" >> "$GITHUB_PATH"
      - name: Validate deployment configuration
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_ACCOUNT_ID" && test -n "$AWS_REGION"
          [[ "$DEPLOY_ROLE" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/lostlink-dev-github-deploy" ]]
          HELM_BIN=helm python -m pytest -q infra/deploy
      - name: Assume dev deployment identity
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: lostlink-deploy-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Lease runner endpoint access
        if: steps.current.outputs.deploy == 'true'
        run: python infra/deploy/cd_access.py open --lease "$ACCESS_LEASE" --region "$AWS_REGION"
      - name: Configure dev kubeconfig
        if: steps.current.outputs.deploy == 'true'
        run: aws eks update-kubeconfig --name lostlink-dev --alias lostlink-dev --region "$AWS_REGION" --kubeconfig "$KUBECONFIG"
      - name: Release the images published by this CI run
        if: steps.current.outputs.deploy == 'true'
        run: python infra/deploy/cd_deploy.py --sha "$GITHUB_SHA" --account "$AWS_ACCOUNT_ID" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG"
      - name: Remove runner endpoint access
        if: always() && steps.current.outputs.deploy == 'true'
        run: python infra/deploy/cd_access.py close --lease "$ACCESS_LEASE" --region "$AWS_REGION"
      - name: Remove local deployment files
        if: always()
        run: rm -f "$KUBECONFIG"
