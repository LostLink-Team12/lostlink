name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: list
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          services = sorted(path.parent.name for path in Path("services").glob("*/Dockerfile"))
          if not services:
              raise SystemExit("No services with a Dockerfile found")
          for service in services:
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", service):
                  raise SystemExit(f"Invalid service directory name: {service}")
              if not (Path("services") / service / "requirements.txt").is_file():
                  raise SystemExit(f"Missing requirements.txt for {service}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"services={json.dumps(services)}\n")
          PY

  test:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (dependencies, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build-image:
    needs: [discover, test, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      SERVICE_NAME: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build service image
        run: docker build --pull --tag "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" "services/${SERVICE_NAME}"
      - name: Trivy image scan (OS and application dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: lostlink/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      # Transfer the scanned image; publishing must not rebuild it.
      - name: Save scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output "${RUNNER_TEMP}/image.tar" "lostlink/${SERVICE_NAME}:${GITHUB_SHA}"
      - name: Upload scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [discover, test, security-scan, build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SERVICE_NAME: ${{ matrix.service }}
    steps:
      - name: Validate AWS configuration
        run: |
          for variable in AWS_ACCOUNT_ID AWS_REGION AWS_ROLE_ARN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Set the ${variable} repository Actions variable. See docs/ci.md."
              exit 1
            fi
          done
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi
          if [[ "${AWS_ROLE_ARN}" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error::AWS_ROLE_ARN must identify a role in AWS_ACCOUNT_ID (standard AWS partition)."
            exit 1
          fi
      - name: Download scanned image from this run
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/scanned-image
      - name: Load scanned image
        run: |
          docker load --input "${RUNNER_TEMP}/scanned-image/image.tar"
          docker image inspect "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" > /dev/null
      - name: Assume AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: lostlink-ci-${{ github.run_id }}
      - name: Check ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "lostlink/${SERVICE_NAME}" > /dev/null
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          mask-password: "true"
      - name: Push scanned image with commit SHA tag
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="${ECR_REGISTRY}/lostlink/${SERVICE_NAME}:${GITHUB_SHA}"
          docker tag "lostlink/${SERVICE_NAME}:${GITHUB_SHA}" "${image}"
          docker push "${image}"
          printf '### Published %s\n\n`%s`\n' "${SERVICE_NAME}" "${image}" >> "$GITHUB_STEP_SUMMARY"
