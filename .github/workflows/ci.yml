name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          echo "services=$(ls -d services/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -m "not integration"

  shared-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock ./libs
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q libs/tests -m "not integration"

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lostlink
          POSTGRES_PASSWORD: lostlink
          POSTGRES_DB: lostlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostlink -d lostlink"
          --health-interval 5s --health-timeout 3s --health-retries 20
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: sns,sqs
          SQS_ENDPOINT_STRATEGY: path
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LOSTLINK_TEST_ADMIN_URL: postgresql+psycopg://lostlink:lostlink@localhost:5432/lostlink
      LOSTLINK_TEST_AWS_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock ./libs
      - run: pytest -q -m integration

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem scan (dependencies, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  build-image:
    needs: [discover, test, shared-library, integration, security-scan]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
      - run: >-
          docker build
          --build-arg SERVICE_DIR=services/${{ matrix.service }}
          -f services/${{ matrix.service }}/Dockerfile
          -t lostlink/${{ matrix.service }}:${{ github.sha }} .
      # Push to ECR and Helm deploy are added by LU JINGXING in Phase 1 (task C2/C3).
