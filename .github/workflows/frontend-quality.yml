name: Frontend and demo data
on:
  pull_request:
    paths: ['frontend/**', 'tests/data/**', 'tests/load/**', '.github/workflows/frontend-quality.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'tests/data/**', 'tests/load/**', '.github/workflows/frontend-quality.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  dataset:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/data/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
